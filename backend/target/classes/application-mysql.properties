# ===================================================================
# MySQL Profile (Persistent Local or Remote MySQL Database)
# Activate with:
#   PowerShell: $env:SPRING_PROFILES_ACTIVE="mysql"; .\mvnw.cmd spring-boot:run
#   Or: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=mysql
# ===================================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quickcourt?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL:update}
spring.jpa.show-sql=false

admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
