# ===================================================================
# Local Development Profile: Persistent File-Based H2 Database (MySQL Mode)
# ===================================================================
# Data persists across application restarts in canonical ~/.quickcourt/quickcourt.mv.db.
# Set SPRING_PROFILES_ACTIVE=mysql to use MySQL instead.
# ===================================================================

spring.datasource.url=${DB_URL:jdbc:h2:file:C:/Users/sanja/OneDrive/Desktop/quickCourt-clone/.quickcourt/quickcourt;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Default admin credentials for local development profile
admin.email=${ADMIN_EMAIL:admin@quickcourt.com}
admin.password=${ADMIN_PASSWORD:Admin@123}

# Razorpay development configuration (Safe defaults; configure real credentials via environment or .env)
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
booking.hold.duration.minutes=${BOOKING_HOLD_MINUTES:10}

# Safe fallback secret for local development profile (overridden by JWT_SECRET env var in production)
jwt.secret=${JWT_SECRET:dev-jwt-secret-quickcourt-persisted-testing-key-32bytes-min}
