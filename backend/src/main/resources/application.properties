spring.application.name=backend
server.port=${PORT:8080}

# Activate dev profile (persistent file-based H2) by default for local development.
# Set SPRING_PROFILES_ACTIVE=mysql (or prod) to use MySQL.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Base persistent H2 datasource configuration (persisted to canonical ~/.quickcourt/quickcourt.mv.db, working-dir independent)
spring.datasource.url=${DB_URL:jdbc:h2:file:~/.quickcourt/quickcourt;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=MySQL}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=${JPA_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL:update}
spring.jpa.show-sql=false

# Common JWT configuration (secret must be supplied via JWT_SECRET environment variable; never hardcoded)
jwt.secret=${JWT_SECRET:}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# Razorpay Payment Gateway Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
booking.hold.duration.minutes=${BOOKING_HOLD_MINUTES:10}
