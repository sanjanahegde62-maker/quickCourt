# ===================================================================
# Production Profile (MySQL Database with schema validation)
# Activate with:
#   SPRING_PROFILES_ACTIVE=prod
# ===================================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quickcourt?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL:validate}
spring.jpa.show-sql=false

admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
